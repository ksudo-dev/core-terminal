name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PACKAGE_VERSION: 0.2.1

jobs:
  fmt:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.93.1
          components: rustfmt
      - run: cargo fmt --check

  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.93.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libgtk-4-dev libvte-2.91-gtk4-dev
      - run: cargo check --locked --all-targets

  clippy:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.93.1
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libgtk-4-dev libvte-2.91-gtk4-dev
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings

  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.93.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential libgtk-4-dev libvte-2.91-gtk4-dev
      - run: cargo test --locked --all-targets --no-fail-fast
      - run: scripts/check-flatpak-host-supervisor.py

  package:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.93.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            appstream build-essential desktop-file-utils dpkg-dev fakeroot \
            libgtk-4-dev libvte-2.91-gtk4-dev lintian pkg-config
      - run: scripts/build-deb.sh "$PACKAGE_VERSION"
      - run: scripts/check-deb.sh dist/core-terminal_${PACKAGE_VERSION}_$(dpkg --print-architecture).deb
      - run: scripts/security-audit.sh dist/core-terminal_${PACKAGE_VERSION}_$(dpkg --print-architecture).deb
      - run: lintian --pedantic dist/core-terminal_${PACKAGE_VERSION}_$(dpkg --print-architecture).deb
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-terminal-deb
          path: dist/core-terminal_${{ env.PACKAGE_VERSION }}_*.deb

  debian-13:
    needs: package
    runs-on: ubuntu-26.04
    container: debian:13-slim
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: core-terminal-deb
          path: package
      - run: |
          apt-get update
          apt-get install --no-install-recommends -y ./package/core-terminal_${PACKAGE_VERSION}_amd64.deb
          dpkg --audit
          ldd /usr/bin/core-terminal
          ! ldd /usr/bin/core-terminal | grep -F 'not found'

  flatpak:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            appstream dbus-daemon desktop-file-utils elfutils flatpak flatpak-builder \
            libglib2.0-bin xauth xvfb
          command -v desktop-file-validate
          command -v gdbus
      - run: |
          flatpak remote-add --if-not-exists --user flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          scripts/check-flatpak-source.sh
          scripts/build-flatpak.sh
      - run: |
          flatpak install --user --noninteractive --or-update \
            dist/io.github.ksudo_dev.CoreTerminal.flatpak
          flatpak info --user io.github.ksudo_dev.CoreTerminal
          flatpak run --user --command=sh \
            io.github.ksudo_dev.CoreTerminal \
            -c '
              set -eu
              test -x /app/bin/core-terminal
              test -x /app/libexec/core-terminal-host-supervisor
              test -r /app/share/core-terminal/default-profiles.json
              test -x /app/libexec/vte-urlencode-cwd
              test -r /app/etc/profile.d/vte.sh
              test -r /app/share/doc/core-terminal/vte/COPYING.README
              test ! -d /app/include
              test ! -d /app/lib/pkgconfig
              find /app/lib -name "libvte-2.91-gtk4.so.0*" -print -quit | grep -q .
            '
          expected_host_shell=$(getent passwd "$(id -u)" | cut -d: -f7)
          dbus-run-session -- flatpak run --user --command=flatpak-spawn \
            io.github.ksudo_dev.CoreTerminal \
            --host --directory="$HOME" \
            "$PWD/scripts/check-flatpak-host-environment.sh" \
            "$expected_host_shell" "$HOME"
          acceptance_root="$RUNNER_TEMP/core-terminal-flatpak-acceptance"
          rm -rf -- "$acceptance_root"
          install -d -m 0700 "$acceptance_root/config"
          marker_suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          host_jobs_seen="$acceptance_root/host-jobs-seen"
          scripts/check-flatpak-process-lifecycle.py \
            "core-terminal-acceptance-bg-${marker_suffix}" 41.234 \
            "core-terminal-acceptance-fg-${marker_suffix}" 40.234 \
            "$host_jobs_seen" &
          lifecycle_pid=$!
          cleanup_lifecycle() {
            if kill -0 "$lifecycle_pid" 2>/dev/null; then
              kill "$lifecycle_pid" 2>/dev/null || true
              wait "$lifecycle_pid" 2>/dev/null || true
            fi
          }
          trap cleanup_lifecycle EXIT INT TERM
          app_status=0
          timeout --kill-after=15s 120s \
            dbus-run-session -- xvfb-run -a flatpak run --user \
            --env=GDK_BACKEND=x11 \
            --env=XDG_CONFIG_HOME="$acceptance_root/config" \
            --env=CORE_TERMINAL_ACCEPTANCE=1 \
            --env=CORE_TERMINAL_ACCEPTANCE_REPORT="$acceptance_root/report.txt" \
            --env=CORE_TERMINAL_ACCEPTANCE_MARKER_SUFFIX="$marker_suffix" \
            --env=CORE_TERMINAL_ACCEPTANCE_HOST_JOBS_SEEN="$host_jobs_seen" \
            io.github.ksudo_dev.CoreTerminal || app_status=$?
          lifecycle_status=0
          wait "$lifecycle_pid" || lifecycle_status=$?
          trap - EXIT INT TERM
          if test -r "$acceptance_root/report.txt"; then
            cat "$acceptance_root/report.txt"
          else
            echo "Core Terminal did not write the Flatpak acceptance report" >&2
          fi
          printf 'Flatpak app status: %s\nHost lifecycle watcher status: %s\n' \
            "$app_status" "$lifecycle_status"
          acceptance_status=0
          test "$app_status" -eq 0 || acceptance_status=1
          test "$lifecycle_status" -eq 0 || acceptance_status=1
          test -r "$acceptance_root/report.txt" || acceptance_status=1
          if test -r "$acceptance_root/report.txt"; then
            grep -Fq 'status=PASS ' "$acceptance_root/report.txt" || \
              acceptance_status=1
          fi
          exit "$acceptance_status"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-terminal-flatpak
          path: dist/io.github.ksudo_dev.CoreTerminal.flatpak
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: flatpak-acceptance-diagnostics
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/core-terminal-flatpak-acceptance/report.txt
            ${{ runner.temp }}/core-terminal-flatpak-acceptance/host-jobs-seen

  private-data:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          scripts/check-private-data.sh
          scripts/check-doc-style.sh
          scripts/security-audit.sh

  notices:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.93.1
      - run: scripts/generate-notices.sh /tmp/THIRD_PARTY_NOTICES.md
      - run: diff -u THIRD_PARTY_NOTICES.md /tmp/THIRD_PARTY_NOTICES.md

  sbom:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.93.1
      - run: scripts/generate-sbom.py . /tmp/core-terminal.cdx.json
      - run: python3 -m json.tool /tmp/core-terminal.cdx.json >/dev/null
      - run: '! grep -Eq ''/home/|/Users/|file://'' /tmp/core-terminal.cdx.json'

  cargo-audit:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.93.1
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2
        with:
          tool: cargo-audit
      - run: cargo audit

  release:
    needs:
      - fmt
      - check
      - clippy
      - test
      - package
      - debian-13
      - flatpak
      - private-data
      - notices
      - sbom
      - cargo-audit
    if: github.ref == 'refs/tags/v0.2.1'
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: core-terminal-*
          path: release-assets
          merge-multiple: true
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.93.1
      - run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "v$PACKAGE_VERSION"
          grep -Fq "core-terminal ($PACKAGE_VERSION)" packaging/changelog
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          git archive --format=tar --prefix="core-terminal-$PACKAGE_VERSION/" "$GITHUB_SHA" \
            | gzip -n > "release-assets/core-terminal-$PACKAGE_VERSION.tar.gz"
          scripts/generate-sbom.py . "release-assets/core-terminal-$PACKAGE_VERSION.cdx.json"
          ! grep -Eq '/home/|/Users/|file://' \
            "release-assets/core-terminal-$PACKAGE_VERSION.cdx.json"

          expected_payloads=$(printf '%s\n' \
            "core-terminal_${PACKAGE_VERSION}_amd64.deb" \
            "io.github.ksudo_dev.CoreTerminal.flatpak" \
            "core-terminal-${PACKAGE_VERSION}.tar.gz" \
            "core-terminal-${PACKAGE_VERSION}.cdx.json" | sort)
          actual_payloads=$(find release-assets -maxdepth 1 -type f -printf '%f\n' | sort)
          test "$actual_payloads" = "$expected_payloads"

          cd release-assets
          sha256sum *.deb *.flatpak *.tar.gz *.cdx.json > SHA256SUMS
          sha256sum --check SHA256SUMS
          expected_release=$(
            {
              printf '%s\n' "$expected_payloads"
              printf '%s\n' SHA256SUMS
            } | sort
          )
          actual_release=$(find . -maxdepth 1 -type f -printf '%f\n' | sort)
          test "$actual_release" = "$expected_release"
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: release-assets/*
      - run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --verify-tag \
            --title "Core Terminal $PACKAGE_VERSION" \
            --notes-file packaging/release-notes-0.2.1.md
        env:
          GH_TOKEN: ${{ github.token }}
