[package]
name = "core-terminal"
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "A small GTK4/VTE terminal modeled on macOS Terminal"
publish = false

[dependencies]
gtk = { version = "0.11", package = "gtk4", features = ["v4_10"] }
vte4 = { version = "0.10", features = ["v0_84"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
libc = "0.2"
plist = "1.10"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
