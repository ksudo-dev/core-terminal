[package]
name = "core-terminal"
version = "0.2.2"
edition = "2021"
license = "GPL-3.0-or-later"
description = "A GTK4 terminal with Terminal.app-style profiles and reusable window groups"
publish = false

[dependencies]
gtk = { version = "0.11", package = "gtk4", features = ["v4_10"] }
vte4 = { version = "0.10", features = ["v0_84"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
libc = "0.2"
plist = "1.10"

[profile.release]
codegen-units = 1
# ThinLTO crashes in the Ubuntu Rust/LLVM 21.1.8 toolchain used for our
# release packages. Keep normal optimized release builds reproducible until
# that compiler defect is fixed upstream.
lto = false
strip = true
